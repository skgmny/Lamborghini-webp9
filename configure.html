<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="김사랑, 김윤하, 조민체, 최석인">
    <meta name="description" content="람보르기니 스포츠카와 SUV 6종의 차량 제원을 확인하고, 외장 색상을 선택해 미리 볼 수 있습니다.">
    <meta name="keywords" content="람보르기니, 차량 커스터마이징, 외장 색상, 테메라리오, 레부엘토, 우루스">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>내 차량 만들기</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;display=swap">
    <link rel="stylesheet" href="configure.css">
    <script src="configure.js" defer></script>
</head>

<body class="config-page config-exterior-stage">
<header class="header">
<a class="brand" href="main.html">
    <img src="images/guinea.png" alt="Lambor Guinea 홈">
</a>

<nav class="header-nav">
    <a href="main.html">HOME</a>
    <a href="about.html">ABOUT</a>
    <a href="models.html">MODELS</a>
    <a href="customize.html" aria-current="page">CUSTOMIZE</a>
</nav>

<a href="favorites.html" class="header-favorite">MY GARAGE +</a>
</header>

<main class="config-main">
    <nav class="config-links" aria-label="차량 이동">
        <a id="config-detail-link" href="customize.html">← 차량 상세</a>
        <a href="models.html">← Models</a>
    </nav>

    <div class="config-title">
        <h1 id="config-model-name"></h1>
        <dl class="config-model-stats" id="config-model-stats" hidden></dl>
    </div>

    <form class="config-controls">
        <fieldset>
            <legend>외장 색상</legend>
            <div class="config-swatches" id="exterior-options"></div>
        </fieldset>
        <p id="config-status" role="status">차량 정보를 불러오는 중이에요.</p>
    </form>

    <section class="config-preview" aria-label="차량 미리보기">
        <figure>
            <div class="config-image-frame">
                <img id="config-image" alt="" hidden>
            </div>
            <figcaption id="config-caption" aria-live="polite"></figcaption>
        </figure>
    </section>

    <p class="config-copyright">Copyright © 2026 Automobili Lamborghini S.p.A.</p>
</main>
</body>
</html>
